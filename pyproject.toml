[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idempotent-core"
version = "1.0.0"
description = "Native C++20 and CUDA Zero-Copy In-Place Idempotent Permutations Engine"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dr. A. Emre ÇETİN", email = "aemre.cetin@gmail.com" }
]
keywords = [
    "idempotent", "permutations", "zero-copy", "in-place", "cpp20", "cuda",
    "blackwell", "hpc", "tensor", "compaction"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "torch>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/aemre-cetin/idempotent-permutations"
Repository = "https://github.com/aemre-cetin/idempotent-permutations"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idempotent_core = ["*.dll", "*.so", "*.dylib"]